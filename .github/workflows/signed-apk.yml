name: Build signed APK

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Ensure Android SDK is available
        run: |
          if [[ ! -f "$ANDROID_HOME/platforms/android-35/android.jar" ||
                ! -x "$ANDROID_HOME/build-tools/35.0.0/apksigner" ]]; then
            sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
          fi

      - name: Run unit tests
        run: bash ./gradlew --no-daemon :app:testReleaseUnitTest

      - name: Upload unit test report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unit-test-report-${{ github.sha }}
          path: app/build/reports/tests/testReleaseUnitTest
          if-no-files-found: ignore

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Ensure Android SDK is available
        run: |
          if [[ ! -f "$ANDROID_HOME/platforms/android-35/android.jar" ||
                ! -x "$ANDROID_HOME/build-tools/35.0.0/apksigner" ]]; then
            sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
          fi

      - name: Run release lint
        run: bash ./gradlew --no-daemon :app:lintRelease

      - name: Upload lint report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lint-report-${{ github.sha }}
          path: app/build/reports/lint-results-release.html
          if-no-files-found: ignore

  build:
    needs: [test, lint]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      version_name: ${{ steps.apk.outputs.version_name }}
      asset_name: ${{ steps.apk.outputs.asset_name }}
      branch_label: ${{ steps.apk.outputs.branch_label }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Ensure Android SDK is available
        run: |
          if [[ ! -f "$ANDROID_HOME/platforms/android-35/android.jar" ||
                ! -x "$ANDROID_HOME/build-tools/35.0.0/apksigner" ]]; then
            sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
          fi

      - name: Restore signing configuration
        env:
          KEYSTORE_B64: ${{ secrets.NEXTTV_KEYSTORE_BASE64 }}
          SIGNING_PROPERTIES_B64: ${{ secrets.NEXTTV_SIGNING_PROPERTIES_BASE64 }}
        run: |
          if [[ -z "$KEYSTORE_B64" || -z "$SIGNING_PROPERTIES_B64" ]]; then
            echo '::error::The Next TV signing secrets are missing.'
            exit 1
          fi
          umask 077
          mkdir -p .signing
          printf '%s' "$KEYSTORE_B64" | base64 --decode > .signing/NextTV-release.p12
          printf '%s' "$SIGNING_PROPERTIES_B64" | base64 --decode > .signing/signing.properties

      - name: Build and verify signed Alpha APK
        id: apk
        run: |
          bash ./gradlew --no-daemon :app:packageNextTvRelease "-PnextTvAlphaBuild=$GITHUB_RUN_NUMBER"
          apk=app/build/outputs/apk/release/app-release.apk
          certificate=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$apk")
          expected=19899ab2e33f7043ffec3d271182cfec5a72e4e4649620c8a1cda5768b5c38be
          actual=$(awk -F ': ' '/certificate SHA-256 digest:/{print $2}' <<< "$certificate")
          if [[ "$actual" != "$expected" ]]; then
            echo '::error::The APK does not match the Next TV release certificate.'
            exit 1
          fi
          badging=$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk")
          version_name=$(sed -n "s/^package:.*versionName='\([^']*\)'.*/\1/p" <<< "$badging")
          if [[ ! "$version_name" =~ ^[0-9]+\.[0-9]+\.[0-9]+-Alpha\.$GITHUB_RUN_NUMBER$ ]]; then
            echo '::error::The APK version does not match the GitHub Alpha build number.'
            exit 1
          fi
          # main keeps the plain version name; every other branch is prefixed with a
          # filesystem-safe slug, e.g. dev-1.4.1-Alpha.5 or dev-1.4.1 for formal builds.
          branch="${GITHUB_REF_NAME}"
          if [[ "$branch" == "main" || "$branch" == "master" ]]; then
            branch_label=""
            branch_prefix=""
          else
            branch_label="$branch"
            slug=$(printf '%s' "$branch" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9._-]+/-/g; s/^-+//; s/-+$//')
            slug=${slug:0:32}
            [[ -n "$slug" ]] || slug="branch"
            branch_prefix="${slug}-"
          fi
          asset="Next-TV-${branch_prefix}${version_name}-signed.apk"
          printf 'version_name=%s\n' "$version_name" >> "$GITHUB_OUTPUT"
          printf 'asset_name=%s\n' "$asset" >> "$GITHUB_OUTPUT"
          printf 'branch_label=%s\n' "$branch_label" >> "$GITHUB_OUTPUT"
          mkdir -p deliverables
          cp "$apk" "deliverables/${asset}"

      - name: Remove signing files
        if: always()
        run: rm -f .signing/NextTV-release.p12 .signing/signing.properties

      - name: Upload signed APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Next-TV-signed-${{ github.sha }}
          path: deliverables/Next-TV-*-signed.apk
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: apk-release-${{ github.run_id }}
      cancel-in-progress: false
    steps:
      - name: Download verified APK
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Next-TV-signed-${{ github.sha }}
          path: deliverables

      - name: Publish signed APK as a pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ needs.build.outputs.version_name }}
          ASSET_NAME: ${{ needs.build.outputs.asset_name }}
          BRANCH_LABEL: ${{ needs.build.outputs.branch_label }}
        run: |
          tag="build-${GITHUB_SHA}-${GITHUB_RUN_NUMBER}"
          asset="${ASSET_NAME}"
          apk="deliverables/${asset}"
          test -s "$apk"

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets,isPrerelease,isDraft > release.json; then
            jq -e '.isPrerelease' release.json > /dev/null
            if ! jq -e --arg name "$asset" '.assets | any(.name == $name and .size > 0)' release.json > /dev/null; then
              gh release upload "$tag" "$apk" --repo "$GITHUB_REPOSITORY"
            fi
            if jq -e '.isDraft' release.json > /dev/null; then
              gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --latest=false
            fi
          else
            title="Next TV ${VERSION_NAME}"
            if [[ -n "$BRANCH_LABEL" ]]; then title="Next TV ${BRANCH_LABEL} ${VERSION_NAME}"; fi
            gh release create "$tag" "$apk" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --title "$title" \
              --notes "签名 APK 来自分支 \`${GITHUB_REF_NAME}\`、提交 \`${GITHUB_SHA}\`。构建记录：${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
              --prerelease --latest=false
          fi
