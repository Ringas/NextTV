name: Build signed APK

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'alpha or formal'
        required: true
        default: alpha
        type: choice
        options: [alpha, formal]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Ensure Android SDK is available
        run: |
          if [[ ! -f "$ANDROID_HOME/platforms/android-35/android.jar" ||
                ! -x "$ANDROID_HOME/build-tools/35.0.0/apksigner" ]]; then
            sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
          fi

      - name: Run unit tests
        run: bash ./gradlew --no-daemon :app:testReleaseUnitTest

      - name: Render design screenshots
        run: |
          bash ./gradlew --no-daemon :app:testDebugUnitTest \
            --tests com.nexttv.design.DesignScreenshots

      - name: Upload design screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: design-screens-${{ github.sha }}
          path: app/build/outputs/design-screens
          if-no-files-found: ignore

      - name: Compile instrumentation tests
        run: bash ./gradlew --no-daemon :app:assembleDebugAndroidTest

      - name: Upload unit test report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unit-test-report-${{ github.sha }}
          path: app/build/reports/tests/testReleaseUnitTest
          if-no-files-found: ignore

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Ensure Android SDK is available
        run: |
          if [[ ! -f "$ANDROID_HOME/platforms/android-35/android.jar" ||
                ! -x "$ANDROID_HOME/build-tools/35.0.0/apksigner" ]]; then
            sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
          fi

      - name: Run release lint
        run: bash ./gradlew --no-daemon :app:lintRelease

      - name: Upload lint report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lint-report-${{ github.sha }}
          path: app/build/reports/lint-results-release.html
          if-no-files-found: ignore

  build:
    needs: [test, lint]
    # Secrets are restored only for the trusted release branches. Pull requests and
    # feature branches still run test/lint, but never receive signing material.
    if: github.ref_name == 'main' || github.ref_name == 'dev' || github.ref_name == 'beta'
    environment: release-signing
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      version_name: ${{ steps.apk.outputs.version_name }}
      asset_name: ${{ steps.apk.outputs.asset_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Ensure Android SDK is available
        run: |
          if [[ ! -f "$ANDROID_HOME/platforms/android-35/android.jar" ||
                ! -x "$ANDROID_HOME/build-tools/35.0.0/apksigner" ]]; then
            sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
          fi

      - name: Restore signing configuration
        env:
          KEYSTORE_B64: ${{ secrets.NEXTTV_KEYSTORE_BASE64 }}
          SIGNING_PROPERTIES_B64: ${{ secrets.NEXTTV_SIGNING_PROPERTIES_BASE64 }}
        run: |
          if [[ -z "$KEYSTORE_B64" || -z "$SIGNING_PROPERTIES_B64" ]]; then
            echo '::error::The Next TV signing secrets are missing.'
            exit 1
          fi
          umask 077
          mkdir -p .signing
          printf '%s' "$KEYSTORE_B64" | base64 --decode > .signing/NextTV-release.p12
          printf '%s' "$SIGNING_PROPERTIES_B64" | base64 --decode > .signing/signing.properties

      - name: Build and verify signed APK
        id: apk
        env:
          BUILD_TYPE: ${{ github.event.inputs.build_type }}
        run: |
          build_type="${BUILD_TYPE:-alpha}"
          if [[ "$build_type" != "alpha" && "$build_type" != "formal" ]]; then
            echo "::error::Unknown build_type: $build_type"
            exit 1
          fi

          # main keeps the plain version name; every other branch becomes a channel
          # prefix that is embedded in versionName and therefore visible in settings.
          branch="${GITHUB_REF_NAME}"
          if [[ "$build_type" == "formal" && "$branch" != "main" && "$branch" != "dev" ]]; then
            echo "::error::Formal releases are restricted to main and dev (requested: $branch)."
            exit 1
          fi
          channel=""
          if [[ "$branch" != "main" && "$branch" != "master" ]]; then
            channel=$(printf '%s' "$branch" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9._-]+/-/g; s/^-+//; s/-+$//; s/_/-/g')
            channel=${channel:0:32}
            [[ -n "$channel" ]] || channel="branch"
          fi

          args=(--no-daemon :app:packageNextTvRelease)
          if [[ "$build_type" == "alpha" ]]; then
            args+=("-PnextTvAlphaBuild=$GITHUB_RUN_NUMBER")
          fi
          if [[ -n "$channel" ]]; then
            args+=("-PnextTvChannel=$channel")
          fi
          bash ./gradlew "${args[@]}"

          apk=app/build/outputs/apk/release/app-release.apk
          certificate=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$apk")
          expected_cert=19899ab2e33f7043ffec3d271182cfec5a72e4e4649620c8a1cda5768b5c38be
          actual_cert=$(awk -F ': ' '/certificate SHA-256 digest:/{print $2}' <<< "$certificate")
          if [[ "$actual_cert" != "$expected_cert" ]]; then
            echo '::error::The APK does not match the Next TV release certificate.'
            exit 1
          fi

          badging=$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk")
          version_name=$(sed -n "s/^package:.*versionName='\([^']*\)'.*/\1/p" <<< "$badging")
          version_code=$(sed -n "s/^package:.*versionCode='\([^']*\)'.*/\1/p" <<< "$badging")
          base_version=$(sed -n 's/^versionName=//p' version.properties)
          release_number=$(sed -n 's/^releaseNumber=//p' version.properties)
          expected_version="$base_version"
          if [[ -n "$channel" ]]; then expected_version="$channel-$expected_version"; fi
          if [[ "$build_type" == "alpha" ]]; then expected_version="$expected_version-Alpha.$GITHUB_RUN_NUMBER"; fi
          if [[ "$version_name" != "$expected_version" ]]; then
            echo "::error::Expected versionName $expected_version, got $version_name."
            exit 1
          fi

          expected_code=$((release_number * 100000))
          if [[ "$build_type" == "alpha" ]]; then
            expected_code=$((expected_code + GITHUB_RUN_NUMBER))
          else
            expected_code=$((expected_code + 99999))
          fi
          if [[ "$version_code" != "$expected_code" ]]; then
            echo "::error::Expected versionCode $expected_code, got $version_code."
            exit 1
          fi

          printf 'version_name=%s\n' "$version_name" >> "$GITHUB_OUTPUT"
          printf 'asset_name=Next-TV-%s-signed.apk\n' "$version_name" >> "$GITHUB_OUTPUT"
          mkdir -p deliverables
          cp "$apk" "deliverables/Next-TV-${version_name}-signed.apk"

      - name: Remove signing files
        if: always()
        run: rm -f .signing/NextTV-release.p12 .signing/signing.properties

      - name: Upload signed APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Next-TV-signed-${{ github.sha }}
          path: deliverables/Next-TV-*-signed.apk
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: apk-release-${{ github.run_id }}
      cancel-in-progress: false
    steps:
      - name: Checkout for version bump
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.build_type == 'formal'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Download verified APK
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Next-TV-signed-${{ github.sha }}
          path: deliverables

      - name: Publish signed APK as a release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ needs.build.outputs.version_name }}
          ASSET_NAME: ${{ needs.build.outputs.asset_name }}
          BUILD_TYPE: ${{ github.event.inputs.build_type }}
        run: |
          tag="build-${GITHUB_SHA}-${GITHUB_RUN_NUMBER}"
          asset="${ASSET_NAME}"
          apk="deliverables/${asset}"
          test -s "$apk"

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets,isPrerelease,isDraft > release.json; then
            if [[ "${BUILD_TYPE:-alpha}" == "alpha" ]]; then jq -e '.isPrerelease' release.json > /dev/null; fi
            if ! jq -e --arg name "$asset" '.assets | any(.name == $name and .size > 0)' release.json > /dev/null; then
              gh release upload "$tag" "$apk" --repo "$GITHUB_REPOSITORY"
            fi
            if jq -e '.isDraft' release.json > /dev/null; then
              gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --latest=false
            fi
          else
            flags=(--latest=false)
            if [[ "${BUILD_TYPE:-alpha}" == "alpha" ]]; then flags+=(--prerelease); fi
            gh release create "$tag" "$apk" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --title "Next TV ${VERSION_NAME}" \
              --notes "签名 APK 来自分支 \`${GITHUB_REF_NAME}\`、提交 \`${GITHUB_SHA}\`。构建记录：${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
              "${flags[@]}"
          fi

      - name: Propose next version bump
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.build_type == 'formal'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          released_release=$(awk -F= '$1=="releaseNumber"{print $2}' version.properties)
          result=$(python3 tools/bump_version.py --released-release "$released_release" --json)
          echo "$result"
          if [[ "$(jq -r '.bumped' <<<"$result")" != "true" ]]; then
            echo "version.properties is already advanced; nothing to do."
            exit 0
          fi

          next_version=$(jq -r '.next_version' <<<"$result")
          next_release=$(jq -r '.next_release' <<<"$result")
          branch="chore/bump-${next_version}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          gh auth setup-git
          git checkout -B "$branch"
          git add version.properties
          git commit -m "chore: bump to ${next_version} after formal release ${released_release}"
          if git ls-remote --exit-code --heads origin "$branch" > /dev/null 2>&1; then
            git push --force-with-lease origin "$branch"
          else
            git push origin "$branch"
          fi

          existing=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$branch" --base "$GITHUB_REF_NAME" --json number --jq '.[0].number // empty')
          if [[ -n "$existing" ]]; then
            echo "PR #$existing already tracks $branch."
            exit 0
          fi
          body=$(printf '%s\n' \
            "Formal release ${released_release} has been published from \`${GITHUB_REF_NAME}\` at \`${GITHUB_SHA}\`." \
            "" \
            "This PR advances \`version.properties\` so the next Alpha and formal builds use release ${next_release}:" \
            "- versionName: \`${next_version}\`" \
            "- releaseNumber: \`${next_release}\`" \
            "- lastPublishedReleaseNumber: \`${released_release}\`" \
            "" \
            "The patch component was bumped automatically. Edit this PR if the next release should be a minor or major bump." \
            "Release: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/build-${GITHUB_SHA}-${GITHUB_RUN_NUMBER}")
          gh pr create --repo "$GITHUB_REPOSITORY" --base "$GITHUB_REF_NAME" --head "$branch" \
            --title "chore: bump to ${next_version}" \
            --body "$body"
