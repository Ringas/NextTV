      <stop offset="1" stop-color="#FFE3F4"/>
    </linearGradient>
    <linearGradient id="bn2-tv" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D946EF"/>
      <stop offset="1" stop-color="#FB7185"/>
    </linearGradient>
    <filter id="bn2-ds" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#5B1B63" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="320" height="180" fill="url(#bn2-page)"/>

  <g transform="translate(26 46) scale(0.172)">
    <rect x="32" y="32" width="448" height="448" rx="108" fill="url(#bn2-bg)"/>
    <path d="M32 140 A108 108 0 0 1 140 32 H372 A108 108 0 0 1 480 140 V210
