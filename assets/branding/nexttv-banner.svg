<svg xmlns="http://www.w3.org/2000/svg" width="320" height="180" viewBox="0 0 320 180">
  <defs>
    <linearGradient id="bn2-page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171B24"/>
      <stop offset="1" stop-color="#0C0F15"/>
    </linearGradient>
    <linearGradient id="bn2-bg" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#A855F7"/>
      <stop offset="0.5" stop-color="#D946EF"/>
      <stop offset="1" stop-color="#F43F5E"/>
    </linearGradient>
    <linearGradient id="bn2-gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bn2-tri" x1="0" y1="0" x2="0.8" y2="1">
