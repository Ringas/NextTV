      <rect x="118" y="238" width="26" height="26" rx="6" opacity="0.45"/>
      <rect x="152" y="282" width="26" height="26" rx="6" opacity="0.65"/>
    </g>
    <path d="M246 176 L246 336 L372 256 Z"
